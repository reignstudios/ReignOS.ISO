title    ReignOS install medium (%ARCH%, UEFI) [Disable All GPU]
sort-key 03
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on modprobe.blacklist=nouveau nouveau.modeset=0 i915.modeset=0 amdgpu.modeset=0 radeon.modeset=0 nomodeset
